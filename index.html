<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Product Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --text: #111;
      --muted: #888;
      --border: #e0e0e0;
      --accent: #111;
      --gap: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── 헤더 */
    header {
      padding: 56px 40px 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .header-left { flex: 1; }
    .header-left h1 { margin-bottom: 0; }

    .header-contact {
      text-align: right;
      padding-top: 4px;
    }

    .contact-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--text);
      margin-bottom: 14px;
    }

    .contact-item {
      display: flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 7px;
    }

    .contact-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .contact-value {
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #333;
      font-weight: 300;
      user-select: text;
    }

    @media (max-width: 640px) {
      .header-top { flex-direction: column; gap: 28px; }
      .header-contact { text-align: left; }
      .contact-item { justify-content: flex-start; }
    }

    .label {
      font-size: 11px;
      letter-spacing: 5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -1px;
      color: var(--text);
      margin-bottom: 0;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 32px;
    }

    /* ── 메인 */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 40px 60px;
    }

    /* ── 그리드: 항상 3열 */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── 이미지 타일 */
    .tile {
      position: relative;
      aspect-ratio: 3 / 5;
      overflow: hidden;
      background: #eee;
      cursor: pointer;
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .tile img.loaded { opacity: 1; }
    .tile:hover img { transform: scale(1.03); }

    .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      transition: background 0.3s ease;
      pointer-events: none;
    }

    .tile:hover::after { background: rgba(0,0,0,0.04); }

    .tile-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      transition: opacity 0.3s;
    }

    .tile img.loaded ~ .tile-placeholder { opacity: 0; pointer-events: none; }

    /* ── 라이트박스 */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.93);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    #lb-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      max-width: 92vw;
      max-height: 88vh;
      transition: opacity 0.2s ease;
    }

    #lb-content.fade { opacity: 0; }

    .lb-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .lb-panel img {
      max-width: 44vw;
      max-height: 80vh;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    .lb-tag {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .lb-divider {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lb-arrow {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
}

    @media (max-width: 640px) {
      #lb-content {
        flex-direction: column;
        gap: 12px;
        max-width: 90vw;
        max-height: 90vh;
        overflow-y: auto;
      }
      .lb-panel img { max-width: 86vw; max-height: 40vh; }
      .lb-divider { width: 60vw; height: 1px; }
    }

    .lb-btn {
      position: absolute;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      cursor: pointer;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      font-size: 18px;
    }

    .lb-btn:hover { background: rgba(255,255,255,0.18); }

    #lb-close { top: 20px; right: 20px; font-size: 20px; }
    #lb-prev  { left: 16px; }
    #lb-next  { right: 16px; }

    #lb-prev.hidden, #lb-next.hidden { opacity: 0; pointer-events: none; }

    #lb-counter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.5);
    }

    /* ── 푸터 */
    footer {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    footer p {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      header { padding: 40px 20px 20px; }
      main   { padding: 0 20px 60px; }
      footer { padding: 32px 20px; }
      #lb-prev { left: 8px; }
      #lb-next { right: 8px; }
    }
  </style>
</head>
<body>

<!-- ── 헤더 -->
<header>
  <div class="header-top">
    <div class="header-left">
      <p class="label">Portfolio</p>
      <h1>Product<br>Photography</h1>
    </div>
    <div class="header-contact">
      <p class="contact-heading">Contact</p>
      <div class="contact-item">
        <span class="contact-label">Gmail</span>
        <span class="contact-value">jjw42u@gmail.com</span>
      </div>
      <div class="contact-item">
        <span class="contact-label">Phone</span>
        <span class="contact-value">010-4056-4823</span>
      </div>
    </div>
  </div>
  <hr class="divider" />
</header>

<!-- ── 갤러리 -->
<main>
  <div class="grid" id="gallery"></div>
</main>

<!-- ── 라이트박스 -->
<div id="lightbox" role="dialog" aria-modal="true">
  <button class="lb-btn" id="lb-close" aria-label="닫기">&#x2715;</button>
  <button class="lb-btn" id="lb-prev"  aria-label="이전">&#8249;</button>

  <div id="lb-content">
    <div class="lb-panel">
      <img id="lb-img-before" src="" alt="보정 전" />
      <span class="lb-tag">Before</span>
    </div>
    <div class="lb-divider">
      <span class="lb-arrow">&#9654;</span>
    </div>
    <div class="lb-panel">
      <img id="lb-img-after" src="" alt="보정 후" />
      <span class="lb-tag">After</span>
    </div>
  </div>

  <button class="lb-btn" id="lb-next" aria-label="다음">&#8250;</button>
  <div id="lb-counter"></div>
</div>

<!-- ── 푸터 -->
<footer>
  <p>Product Photography Portfolio</p>
  <p style="margin-top: 8px;">© 2026 jjw42u@gmail.com · All rights reserved</p>
</footer>

<script>
// ═══════════════════════════════════════════
//  ✏️  사진 총 개수만 바꾸세요
//  파일명 규칙: images/1.jpg, 2.jpg ...
//              images/1a.jpg, 2a.jpg ... (before)
// ═══════════════════════════════════════════
const TOTAL = 9; // 사진 총 개수
const EXT   = 'webp';
// ═══════════════════════════════════════════

const gallery = document.getElementById('gallery');

// ── 갤러리 빌드
for (let n = 1; n <= TOTAL; n++) {
  const tile = document.createElement('div');
  tile.className = 'tile';

  const img = document.createElement('img');
  img.src      = `images/${n}.${EXT}`;
  img.alt      = `Photo ${n}`;
  img.loading  = 'eager';
  img.decoding = 'sync';
  img.addEventListener('load',  () => img.classList.add('loaded'));
  img.addEventListener('error', () => { ph.innerHTML = '✕'; });

  const ph = document.createElement('div');
  ph.className = 'tile-placeholder';
  ph.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

  tile.appendChild(img);
  tile.appendChild(ph);
  tile.addEventListener('click', () => openLightbox(n));
  gallery.appendChild(tile);
}

// ── a 이미지 프리로드 (갤러리 로드 완료 후 백그라운드에서)
window.addEventListener('load', () => {
  for (let n = 1; n <= TOTAL; n++) {
    const pre = new Image();
    pre.src = `images/${n}a.${EXT}`;
  }
});

// ── 라이트박스
const lightbox    = document.getElementById('lightbox');
const lbContent   = document.getElementById('lb-content');
const lbImgBefore = document.getElementById('lb-img-before');
const lbImgAfter  = document.getElementById('lb-img-after');
const lbCounter   = document.getElementById('lb-counter');
const lbPrev      = document.getElementById('lb-prev');
const lbNext      = document.getElementById('lb-next');
const lbClose     = document.getElementById('lb-close');

let current = 1;

function openLightbox(n) {
  current = n;
  showImage();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  lbImgBefore.src = '';
  lbImgAfter.src  = '';
}

function showImage() {
  lbContent.classList.add('fade');
  setTimeout(() => {
    lbImgBefore.src = `images/${current}a.${EXT}`;
    lbImgAfter.src  = `images/${current}.${EXT}`;
    lbContent.classList.remove('fade');
  }, 150);

  lbCounter.textContent = `${current} / ${TOTAL}`;
  lbPrev.classList.toggle('hidden', current === 1);
  lbNext.classList.toggle('hidden', current === TOTAL);
}

// 사진 클릭 → 원본 크기 새 탭에서 열기 (after만)
lbImgAfter.style.cursor = 'zoom-in';
lbImgAfter.addEventListener('click', () => {
  window.open(`images/${current}.webp`, '_blank');
});

lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', () => { current--; showImage(); });
lbNext.addEventListener('click', () => { current++; showImage(); });

lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowLeft'  && current > 1)     { current--; showImage(); }
  if (e.key === 'ArrowRight' && current < TOTAL) { current++; showImage(); }
});

// 모바일 스와이프
let touchStartX = 0;
lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
lightbox.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) < 40) return;
  if (dx < 0 && current < TOTAL) { current++; showImage(); }
  if (dx > 0 && current > 1)     { current--; showImage(); }
});
</script>
</body>
</html>
